appId: ro.easystudio.photo
productName: EasyStudio Photo
electronVersion: 44.4.5
copyright: EasyStudio
directories:
  output: ../../dist/photo
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: EasyStudio Photo
  artifactName: EasyStudio-Photo-Setup-${version}.exe
  installerLanguages:
    - en_US
    - ro_RO
  multiLanguageInstaller: true
  # NSIS lacks one Romanian string for the per-user/per-machine page; English is used there.
  warningsAsErrors: false
fileAssociations:
  - ext: esp
    name: EasyStudio Photo project
    description: EasyStudio Photo project
