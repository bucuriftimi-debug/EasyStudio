appId: ro.easystudio.photo
productName: EasyStudio Photo
electronVersion: 44.4.5
copyright: EasyStudio
directories:
  output: ../../dist/photo
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# Asks the Microsoft Store whether Pro was bought (tools/store-helper).
extraResources:
  - from: ../../build/StoreHelper.exe
    to: StoreHelper.exe
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: EasyStudio Photo
  artifactName: EasyStudio-Photo-Setup-${version}.exe
  installerLanguages:
    - en_US
    - ro_RO
  multiLanguageInstaller: true
  # NSIS lacks one Romanian string for the per-user/per-machine page; English is used there.
  warningsAsErrors: false
fileAssociations:
  - ext: esp
    name: EasyStudio Photo project
    description: EasyStudio Photo project
# Microsoft Store package (MSIX / AppX). Microsoft signs it when it is published, so there is no
# SmartScreen warning. The three identity values come from Partner Center → the app → Product
# identity (see docs/STORE.ro.md). Build with: npm run photo:store
appx:
  identityName: EasyStudioApps.EasyStudioPhoto
  publisher: CN=905B368B-D497-4AB8-B0C9-A5FC8483AFBB
  publisherDisplayName: EasyStudio Apps
  displayName: EasyStudio Photo
  applicationId: EasyStudioPhoto
  languages:
    - en-US
    - ro-RO
