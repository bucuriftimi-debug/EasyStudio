appId: ro.easystudio.video
productName: EasyStudio Video
electronVersion: 44.4.5
copyright: EasyStudio
directories:
  output: ../../dist/video
  buildResources: build
files:
  - out/**
  - package.json
asar: true
# Asks the Microsoft Store whether Pro was bought (tools/store-helper).
extraResources:
  - from: ../../build/StoreHelper.exe
    to: StoreHelper.exe
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: EasyStudio Video
  artifactName: EasyStudio-Video-Setup-${version}.exe
  installerLanguages:
    - en_US
    - ro_RO
  multiLanguageInstaller: true
  warningsAsErrors: false
fileAssociations:
  - ext: esv
    name: EasyStudio Video project
    description: EasyStudio Video project
# Microsoft Store package (MSIX / AppX). Microsoft signs it when it is published, so there is no
# SmartScreen warning. The three identity values come from Partner Center → the app → Product
# identity (see docs/STORE.ro.md). Build with: npm run video:store
appx:
  identityName: EasyStudioApps.EasyStudioVideo
  publisher: CN=905B368B-D497-4AB8-B0C9-A5FC8483AFBB
  publisherDisplayName: EasyStudio Apps
  displayName: EasyStudio Video
  applicationId: EasyStudioVideo
  languages:
    - en-US
    - ro-RO
