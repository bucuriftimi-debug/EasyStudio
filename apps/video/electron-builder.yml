appId: ro.easystudio.video
productName: EasyStudio Video
electronVersion: 44.4.5
copyright: EasyStudio
directories:
  output: ../../dist/video
  buildResources: build
files:
  - out/**
  - package.json
asar: true
win:
  target: nsis
  icon: build/icon.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: EasyStudio Video
  artifactName: EasyStudio-Video-Setup-${version}.exe
  installerLanguages:
    - en_US
    - ro_RO
  multiLanguageInstaller: true
  warningsAsErrors: false
fileAssociations:
  - ext: esv
    name: EasyStudio Video project
    description: EasyStudio Video project
